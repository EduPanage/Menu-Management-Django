{% extends "application.html" %}
{% block content %}
<h1>Restaurant | delete</h1>
<p>Are you sure you want to delete <strong>{{ restaurant.name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm delete</button>
    <a href="{% url 'show_restaurants' %}">Cancel</a>
</form>
{% endblock content %}
