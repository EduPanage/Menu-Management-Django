{% extends "application.html" %}
{% block content %}

<h1>Menu Item | edit</h1>

<form method="POST">
    {% csrf_token %}
    
    <label for="category">Category:</label>
    <input type="text" id="category" name="category" value="{{ menu_item.category }}" required><br>

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" value="{{ menu_item.name }}" required><br>

    <label for="description">Description:</label>
    <textarea id="description" name="description">{{ menu_item.description }}</textarea><br>

    <label for="price">Price:</label>
    <input type="text" id="price" name="price" value="{{ menu_item.price }}" required><br>

    <button type="submit">Confirm</button>
    <a href="{% url 'menu' restaurant_id %}">Cancel</a>
</form>

{% endblock content %}
